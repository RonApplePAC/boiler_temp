# Boiler Temperature Alert Automations
# Paste into Home Assistant (Settings > Automations > + Create > Edit in YAML), one block at a time.
#
# PREREQUISITE: create a Toggle helper named "Boiler alerts paused"
#   (Settings > Devices & services > Helpers > Create helper > Toggle)
#   It must end up as entity  input_boolean.boiler_alerts_paused
#
# Behaviour:
#  - LOW  : fires after the ESPHome device has seen < 140F for 10 minutes, then REPEATS HOURLY
#           until the boiler recovers or you press "Pause alerts" on the notification
#           (or turn on the helper). Pause clears itself when the boiler returns to normal.
#  - HIGH : fires once, after > 190F for 1 minute.
#  - OFFLINE: no reading from the probe/device for 10 minutes.
# Telegram ("Jonah") messages come from ~/.hermes/scripts/boiler_watch.py on the Hermes server,
# which watches the same entities. These automations are the Home Assistant app push.
# NOTE: entity ids assume ESPHome device friendly_name 'Basement'. Verify in Developer Tools > States after first flash.
# Change the notify target if the alerts should go to a different phone.

- alias: "Boiler Low Alert (repeats hourly until paused)"
  id: boiler_temp_low_alert
  description: "Low boiler temp: notify, then repeat every hour until recovered or paused"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.basement_boiler_temperature_low
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.boiler_alerts_paused
      state: "off"
  action:
    - repeat:
        sequence:
          - service: notify.mobile_app_ronalds_iphone
            data:
              title: "Boiler Alert: Temperature LOW"
              message: >
                Boiler water is {{ states('sensor.basement_boiler_water_temperature') }}°F
                (alert below 140°F). Repeats hourly until recovered or paused.
              data:
                tag: boiler-low
                ttl: 0
                priority: high
                push:
                  interruption-level: time-sensitive
                actions:
                  - action: BOILER_PAUSE
                    title: "Pause alerts"
          - wait_for_trigger:
              - platform: state
                entity_id: binary_sensor.basement_boiler_temperature_low
                to: "off"
              - platform: state
                entity_id: input_boolean.boiler_alerts_paused
                to: "on"
            timeout: "01:00:00"
            continue_on_timeout: true
        until:
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.basement_boiler_temperature_low
                state: "off"
              - condition: state
                entity_id: input_boolean.boiler_alerts_paused
                state: "on"

- alias: "Boiler High Alert"
  id: boiler_temp_high_alert
  description: "High boiler temp: notify once"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.basement_boiler_temperature_high
      to: "on"
  action:
    - service: notify.mobile_app_ronalds_iphone
      data:
        title: "Boiler Alert: Temperature HIGH"
        message: "Boiler water is {{ states('sensor.basement_boiler_water_temperature') }}°F (alert above 190°F)."
        data:
          tag: boiler-high
          ttl: 0
          priority: high
          push:
            interruption-level: time-sensitive

- alias: "Boiler Alerts - Pause button"
  id: boiler_temp_pause_action
  description: "Handle the 'Pause alerts' button on the low-temp notification"
  mode: single
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: BOILER_PAUSE
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.boiler_alerts_paused
    - service: notify.mobile_app_ronalds_iphone
      data:
        title: "Boiler alerts paused"
        message: "Repeat alerts are paused. They re-arm automatically when the boiler returns to normal."
        data:
          tag: boiler-low

- alias: "Boiler Back to Normal (and re-arm)"
  id: boiler_temp_normal
  description: "Alert cleared: notify and clear the pause so the next problem alerts again"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.basement_boiler_temperature_alert
      from: "on"
      to: "off"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.boiler_alerts_paused
    - service: notify.mobile_app_ronalds_iphone
      data:
        title: "Boiler: Back to Normal"
        message: "Boiler water is {{ states('sensor.basement_boiler_water_temperature') }}°F."
        data:
          tag: boiler-low

- alias: "Boiler Sensor Offline"
  id: boiler_temp_offline
  description: "No temperature reading from the boiler device for 10 minutes"
  mode: single
  trigger:
    - platform: state
      entity_id: sensor.basement_boiler_water_temperature
      to:
        - "unavailable"
        - "unknown"
      for: "00:10:00"
  action:
    - service: notify.mobile_app_ronalds_iphone
      data:
        title: "Boiler sensor OFFLINE"
        message: "No boiler temperature reading for 10 minutes. Check the probe wiring / device power / WiFi. Boiler is NOT being monitored."
        data:
          tag: boiler-offline
          ttl: 0
          priority: high
          push:
            interruption-level: time-sensitive
